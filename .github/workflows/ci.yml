name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Shopify Theme Check
        uses: shopify/theme-check-action@v2
        with:
          theme_root: "."
          token: ${{ github.token }}

  validate-json:
    name: Validate JSON (templates, config, locales, groups)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON files
        run: python3 .github/scripts/validate_json.py

  variant-picker:
    name: PDP variant picker regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate variant selection against sections/product.liquid
        run: node .github/scripts/variant_picker_test.mjs

  cart-drawer:
    name: Cart drawer regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simulate add/change/remove against sections/gk-cart-drawer.liquid
        run: node .github/scripts/cart_drawer_test.mjs

  staging-first:
    name: Staging-first gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - name: Require PRs into main to come from staging
        run: |
          if [ "${{ github.head_ref }}" != "staging" ]; then
            echo "::error::PRs into main must come from the staging branch. Merge into staging, verify on the dev shop (gotham-rugby-staging), then open staging → main."
            exit 1
          fi
          echo "PR originates from staging — ok"
