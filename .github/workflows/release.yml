name: Release

# Mints a git tag + GitHub Release whenever a push to main carries a NEW
# theme_version in config/settings_schema.json (the version shown on the
# theme card in Online Store → Themes).
#
# Idempotent by design: pushes where the version already has a tag no-op,
# so shopify[bot] theme-editor sync commits and unbumped merges never mint
# duplicate releases. Bump the version with
# .github/scripts/bump_theme_version.py before opening the staging → main PR
# (see AGENTS.md "Releases & theme version").

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    name: Mint theme release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag and release when theme_version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python3 .github/scripts/bump_theme_version.py --print)"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::theme_version '$VERSION' in config/settings_schema.json is not semver (X.Y.Z)"
            exit 1
          fi
          TAG="v$VERSION"
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "$TAG already tagged — nothing to mint (editor-sync commits and unbumped merges land here too)."
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Gotham theme $TAG" --generate-notes
          echo "Minted $TAG at $GITHUB_SHA"
